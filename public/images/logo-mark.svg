<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!--
    Meta'gor emblem — rebuilt as layered vector from the approved concept:
    beveled gold shield, runic arcs, fel eye with gold M pupil.
    Re-rasterize favicons after edits: node scripts/generate-favicon.mjs
  -->
  <defs>
    <!-- beveled gold rim -->
    <linearGradient id="rimGold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0"    stop-color="#f9edb9"/>
      <stop offset="0.35" stop-color="#d4af5e"/>
      <stop offset="0.65" stop-color="#8a6d2f"/>
      <stop offset="1"    stop-color="#edcf8b"/>
    </linearGradient>
    <linearGradient id="rimGoldV" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f2dda0"/>
      <stop offset="0.5" stop-color="#c9a558"/>
      <stop offset="1" stop-color="#7d6128"/>
    </linearGradient>
    <!-- dark steel plate -->
    <radialGradient id="plate" cx="0.5" cy="0.32" r="0.95">
      <stop offset="0"    stop-color="#1d232e"/>
      <stop offset="0.55" stop-color="#12161f"/>
      <stop offset="1"    stop-color="#08090d"/>
    </radialGradient>
    <!-- fel energy -->
    <radialGradient id="iris" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0"    stop-color="#eafff2"/>
      <stop offset="0.25" stop-color="#5cffa0"/>
      <stop offset="0.6"  stop-color="#00c853"/>
      <stop offset="0.9"  stop-color="#04602a"/>
      <stop offset="1"    stop-color="#023418"/>
    </radialGradient>
    <radialGradient id="felBloom" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#00ff77" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#00ff77" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="felStroke" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0"   stop-color="#57ff9d"/>
      <stop offset="0.5" stop-color="#00e05a"/>
      <stop offset="1"   stop-color="#009643"/>
    </linearGradient>
    <!-- fel glow -->
    <filter id="felGlow" x="-80%" y="-80%" width="260%" height="260%">
      <feDropShadow dx="0" dy="0" stdDeviation="2" flood-color="#00ff77" flood-opacity="0.85"/>
    </filter>
    <filter id="felGlowSoft" x="-80%" y="-80%" width="260%" height="260%">
      <feDropShadow dx="0" dy="0" stdDeviation="1.2" flood-color="#00ff77" flood-opacity="0.6"/>
    </filter>
  </defs>

  <!-- ===== shield silhouette: gold beveled rim ===== -->
  <path d="M32 2 L55 9 V29 C55 43 47 54 32 61.5 C17 54 9 42 9 29 V9 Z" fill="url(#rimGold)"/>
  <!-- rim inner edge (dark line gives the bevel depth) -->
  <path d="M32 4.6 L53.2 11 V28.9 C53.2 41.8 45.7 51.8 32 58.6 C18.3 51.8 10.8 40 10.8 28.9 V11 Z"
        fill="#0c0e12" stroke="rgba(60,45,15,0.85)" stroke-width="0.9"/>

  <!-- ===== inner face: dark plate + runic arcs ===== -->
  <path d="M32 6.8 L51.2 12.8 V28.7 C51.2 40.5 44.2 49.7 32 56.2 C19.8 49.7 12.8 40.5 12.8 28.7 V12.8 Z"
        fill="url(#plate)" stroke="rgba(238,209,140,0.32)" stroke-width="0.8"/>

  <!-- runic arc: top band -->
  <g fill="none" stroke="url(#felStroke)" stroke-width="1.15" stroke-linecap="round"
     filter="url(#felGlowSoft)" opacity="0.95">
    <!-- top arc runes (Elder Futhark-inspired strokes) -->
    <path d="M20.5 14.5 L22.3 18.3 L20.5 15.2 L24 13.4"/>          <!-- ᚠ fehu-ish -->
    <path d="M24.8 17.6 V13.2 L27.4 16.6 L24.8 19.2"/>              <!-- ᚲ kaunan -->
    <path d="M30.3 12 V20"/>                                        <!-- ᛁ isa -->
    <path d="M33 12 V20 M33 15.5 L36 12.5 M33 16.5 L36 19.5"/>      <!-- ᚾ nauthiz -->
    <path d="M37.5 13.2 L40.3 16.2 M37.5 16.2 L40.3 13.2 M37.5 13.2 V19.2"/> <!-- ᚷ gebo -->
    <path d="M43.2 14.6 L44.9 19.4 M44.2 13.9 L43 20.2"/>           <!-- ᚱ raidho -->
  </g>
  <!-- runic arc: bottom band (shorter, mirrored feel) -->
  <g fill="none" stroke="url(#felStroke)" stroke-width="1.1" stroke-linecap="round"
     filter="url(#felGlowSoft)" opacity="0.8">
    <path d="M22.5 49.5 L24.3 45.3 M24.3 45.5 L26.1 49.2"/>
    <path d="M30 51.2 V45.4 M30 47 L29 48.6 M29 45.5 L31.2 47.6"/>
    <path d="M35 45.2 V51.5"/>
    <path d="M38.5 45.5 L41 46.8 M40.4 44.8 L39.6 51"/>
  </g>

  <!-- ===== fel eye ===== -->
  <!-- eye socket bloom -->
  <ellipse cx="32" cy="33" rx="17" ry="12.5" fill="url(#felBloom)" opacity="0.9"/>
  <!-- eye outline: outer gold, inner fel -->
  <path d="M12.5 33 Q32 21.5 51.5 33 Q32 44.5 12.5 33 Z"
        fill="none" stroke="url(#rimGoldV)" stroke-width="2.1"/>
  <path d="M15.5 33 Q32 24 48.5 33 Q32 42 15.5 33 Z"
        fill="none" stroke="url(#felStroke)" stroke-width="1" filter="url(#felGlowSoft)"/>
  <!-- iris -->
  <circle cx="32" cy="33" r="9.6" fill="url(#iris)" filter="url(#felGlow)"/>
  <circle cx="32" cy="33" r="9.6" fill="none" stroke="rgba(2,52,24,0.9)" stroke-width="1"/>
  <!-- subtle iris striations -->
  <g stroke="rgba(230,255,240,0.35)" stroke-width="0.55" stroke-linecap="round">
    <line x1="32" y1="24.6" x2="32" y2="26.8"/>
    <line x1="25.2" y1="28.4" x2="26.9" y2="29.7"/>
    <line x1="38.8" y1="28.4" x2="37.1" y2="29.7"/>
    <line x1="24.6" y1="35.6" x2="26.4" y2="34.9"/>
    <line x1="39.4" y1="35.6" x2="37.6" y2="34.9"/>
  </g>

  <!-- ===== bold serif M as the pupil ===== -->
  <g filter="url(#felGlow)">
    <!-- M body with serif feet: dark gold-on-fel read -->
    <path d="M27.2 39.5 V26.2 L32 32.6 L36.8 26.2 V39.5
             L34.9 39.5 V31.2 L32 35.1 L29.2 31.2 V39.5 Z"
          fill="url(#rimGoldV)" stroke="#3a2c10" stroke-width="0.5"/>
  </g>
</svg>